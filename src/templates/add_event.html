<!-- src/templates/add_event.html -->
{% extends "base.html" %}

{% block title %}Agregar Evento{% endblock %}

{% block content %}
<h1>Agregar Nuevo Evento</h1>
<form method="POST" action="{{ url_for('main.add_event') }}">
    <label for="name">Nombre del Evento:</label>
    <input type="text" id="name" name="name" required>

    <label for="location">Ubicación:</label>
    <input type="text" id="location" name="location" required>

    <label for="date">Fecha:</label>
    <input type="date" id="date" name="date" required>

    <label for="flyer">URL del Flyer (opcional):</label>
    <input type="text" id="flyer" name="flyer">

    <label for="image">Subir Imagen (opcional):</label>
    <input type="file" id="image" name="image">

    <label for="rows">Filas de Asientos:</label>
    <input type="number" id="rows" name="rows" min="1" required>

    <label for="cols">Columnas de Asientos:</label>
    <input type="number" id="cols" name="cols" min="1" required>

    <button type="submit">Agregar Evento</button>
</form>
{% endblock %}
